[project]
name = "mtggympy"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "numpy==2.4.4",
    "pandas==3.0.2",
    "pyright==1.1.408",
    "pygame==2.6.1",
    "keyboard==0.13.5",
    "gymnasium==1.2.3",
    "tqdm==4.67.3",
    "py-spy==0.4.1",
    "imgui_bundle[full]",
    "dataclass-csv>=1.4.1",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "mtggympy",
    "pytest>=9.0.3",
]
